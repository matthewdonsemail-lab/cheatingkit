name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run naming:check && npm run docs:check
      - run: bun run test:cli
      - run: npm run build
      - name: Stage and smoke-test the npm package
        run: |
          npm run stage:cli
          bun .release/ck/bin/ck.js --version
          npm pack --dry-run --json ./.release/ck > /tmp/ck-pack.json
          node -e 'const p=require("/tmp/ck-pack.json")[0]; if (!p.files.some(f=>f.path==="bin/ck.js") || !p.files.some(f=>f.path==="cheatingkit.yaml")) process.exit(1)'
