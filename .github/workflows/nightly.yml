name: nightly

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: ck-nightly
  cancel-in-progress: false

jobs:
  nightly:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(main): release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11.17.0
      - run: npm ci
      - run: npm run check
      - name: Stage incremented nightly package
        id: version
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(node scripts/release/nightly-version.mjs "$SOURCE_SHA")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node scripts/release/stage-cli.mjs "$VERSION"
          npm run check:staged-package
      - name: Publish nightly ck to npm
        run: npm publish ./.release/ck --tag next --access public --provenance
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$SOURCE_SHA" --prerelease --latest=false --title "ck nightly $VERSION" --notes "Nightly build from main at $SOURCE_SHA. Install with bun add -g cheatingkit@next."
